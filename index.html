<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>百家爭鳴 · 전국난투</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@400;700;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="wrap">
  <canvas id="c" width="960" height="540"></canvas>
  <div id="touch" hidden>
    <div class="pad left">
      <button data-k="left">◀</button>
      <button data-k="right">▶</button>
    </div>
    <div class="pad right">
      <button data-k="up">跳</button>
      <button data-k="block">防</button>
      <button data-k="light">輕</button>
      <button data-k="heavy">重</button>
      <button data-k="special">技</button>
      <button data-k="ult">極</button>
    </div>
  </div>
</div>
<script src="src/data.js"></script>
<script src="src/audio.js"></script>
<script src="src/render.js"></script>
<script src="src/game.js"></script>
</body>
</html>
